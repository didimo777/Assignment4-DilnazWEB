
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book a Train Ticket</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="container py-4 py-md-5">

    <div class="booking-card mx-auto">

      <header class="booking-header">
        <h1>Book a train ticket</h1>
      </header>

      <form action="#" method="get" class="booking-form">

        <fieldset class="mb-4">
          <legend class="visually-hidden">Trip type</legend>

          <div class="trip-switch">
            <input
              type="radio"
              class="btn-check"
              name="tripType"
              id="oneWay"
              value="one-way"
              checked
            >
            <label class="btn trip-btn" for="oneWay">
              One way
            </label>

            <input
              type="radio"
              class="btn-check"
              name="tripType"
              id="roundTrip"
              value="round-trip"
            >
            <label class="btn trip-btn" for="roundTrip">
              Round trip
            </label>
          </div>
        </fieldset>

        <div class="row g-3 mb-3">

          <div class="col-12 col-md-6">
            <div class="form-floating">
              <input
                type="text"
                class="form-control"
                id="fromStation"
                name="from"
                placeholder="From"
                value="Astana"
                required
              >
              <label for="fromStation">From</label>
            </div>
          </div>

          <div class="col-12 col-md-6">
            <div class="form-floating">
              <input
                type="text"
                class="form-control"
                id="toStation"
                name="to"
                placeholder="To"
                value="Almaty"
                required
              >
              <label for="toStation">To</label>
            </div>
          </div>

        </div>

        <div class="row g-3 mb-4">

          <div class="col-12 col-md-4">
            <label for="departure" class="form-label">
              Departure
            </label>
            <input
              type="date"
              class="form-control"
              id="departure"
              name="departure"
              required
            >
          </div>

          <div class="col-12 col-md-4">
            <label for="returnDate" class="form-label">
              Return
            </label>
            <input
              type="date"
              class="form-control"
              id="returnDate"
              name="return"
            >
          </div>

          <div class="col-12 col-md-4">
            <label for="passengers" class="form-label">
              Passengers
            </label>
            <select
              class="form-select"
              id="passengers"
              name="passengers"
              required
            >
              <option value="1">1 adult</option>
              <option value="2">2 adults</option>
              <option value="3">3 adults</option>
              <option value="4">4 adults</option>
              <option value="5">5 adults</option>
              <option value="6">6 adults</option>
            </select>
          </div>

        </div>

        <fieldset class="mb-4">
          <legend class="form-label">
            Carriage class
          </legend>

          <div class="d-flex flex-wrap gap-3">

            <div class="form-check">
              <input
                class="form-check-input"
                type="radio"
                name="carriage"
                id="seat"
                value="seat"
                required
              >
              <label class="form-check-label" for="seat">
                Seat
              </label>
            </div>

            <div class="form-check">
              <input
                class="form-check-input"
                type="radio"
                name="carriage"
                id="coupe"
                value="coupe"
                checked
              >
              <label class="form-check-label" for="coupe">
                Coupé
              </label>
            </div>

            <div class="form-check">
              <input
                class="form-check-input"
                type="radio"
                name="carriage"
                id="sleeper"
                value="sleeper"
              >
              <label class="form-check-label" for="sleeper">
                Sleeper
              </label>
            </div>

          </div>
        </fieldset>

        <div class="row g-3 mb-4">

          <div class="col-12 col-md-6">
            <label for="phone" class="form-label">
              Phone
            </label>

            <div class="input-group">
              <span class="input-group-text">+7</span>
              <input
                type="tel"
                class="form-control"
                id="phone"
                name="phone"
                placeholder="701 234 56 78"
                autocomplete="tel-national"
                required
              >
            </div>
          </div>

          <div class="col-12 col-md-6">
            <label for="email" class="form-label">
              Email
            </label>
            <input
              type="email"
              class="form-control"
              id="email"
              name="email"
              placeholder="name@example.com"
              autocomplete="email"
              required
            >
          </div>

        </div>

        <div class="form-check form-switch mb-3">
          <input
            class="form-check-input"
            type="checkbox"
            role="switch"
            id="sms"
            name="sms"
            value="yes"
          >
          <label class="form-check-label" for="sms">
            Also send the ticket by SMS
          </label>
        </div>

        <div class="form-check mb-4">
          <input
            class="form-check-input"
            type="checkbox"
            id="agreement"
            name="agreement"
            value="accepted"
            required
          >
          <label class="form-check-label" for="agreement">
            I agree with the carriage rules
          </label>
        </div>

        
        <div class="d-flex flex-column flex-md-row
                    justify-content-md-end gap-3">

          <button
            type="reset"
            class="btn btn-clear order-2 order-md-1"
          >
            Clear
          </button>

          <button
            type="submit"
            class="btn btn-find order-1 order-md-2"
          >
            Find trains
          </button>

        </div>

      </form>
    </div>

  </main>

</body>
</html>
